<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d20"><title>SKATE ESCAPE — Crystal Rush</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d20;color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none}#hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:15px;right:15px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-weight:850;text-shadow:0 2px 12px #0008}.stat{background:#101a32bd;border:1px solid #ffffff22;border-radius:16px;padding:9px 13px;backdrop-filter:blur(8px);font-size:13px}.stat b{font-size:19px}.gem{color:#83f4ff}.boost{color:#ffe88b}#pause{pointer-events:auto;border:1px solid #ffffff33;background:#101a32ce;color:white;border-radius:14px;padding:11px 15px;font-size:18px}#tip{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap;background:#101a32b8;border:1px solid #ffffff22;border-radius:40px;padding:10px 17px;font-size:12px;font-weight:700;opacity:.8}#overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding:20px;background:#050a19c2;backdrop-filter:blur(9px);pointer-events:auto}#panel{width:min(440px,100%);max-height:88vh;overflow-y:auto;background:linear-gradient(145deg,#1c2c53,#10172d);border:1px solid #8baaff44;border-radius:28px;box-shadow:0 20px 70px #0008;padding:24px;text-align:center}h1{margin:0;font-size:clamp(29px,8vw,45px);letter-spacing:-2px;line-height:1.05}h1 span{color:#65eaff}p{color:#bdc9e5;line-height:1.5}button{font:inherit;cursor:pointer} .primary,.secondary{display:block;width:100%;border:0;border-radius:15px;padding:14px 16px;margin-top:10px;font-weight:850;font-size:15px}.primary{background:linear-gradient(100deg,#5ef1de,#7eb4ff);color:#071529}.secondary{background:#ffffff16;color:#fff;border:1px solid #ffffff26}.row{display:flex;gap:10px}.row button{flex:1}.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.item{background:#ffffff0c;border:1px solid #ffffff26;border-radius:16px;padding:12px;min-height:135px}.preview{height:34px;position:relative;margin:7px auto 13px;width:85px;border-radius:8px;transform:rotate(-8deg)}.preview:before,.preview:after{content:"";position:absolute;bottom:-9px;width:13px;height:13px;border-radius:50%;background:#c4d9ff;border:3px solid #263756}.preview:before{left:9px}.preview:after{right:9px}.item .preview{clip-path:none}.item .preview.pointed{clip-path:polygon(0 50%,16% 0,84% 0,100% 50%,84% 100%,16% 100%)}.item .preview.short{width:65px;border-radius:15px}.item .preview.square{border-radius:1px}.item .preview.split{clip-path:polygon(0 45%,20% 0,80% 0,100% 45%,80% 100%,20% 100%)}.item strong{display:block;font-size:13px}.item small{display:block;color:#b4c5e8;margin:4px}.item button{background:#67dfdb;color:#061b2c;border:0;border-radius:9px;padding:8px;width:100%;font-weight:800;font-size:12px}.item button:disabled{opacity:.55}.hidden{display:none!important}#toast{position:absolute;top:100px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#17274b;border-radius:30px;opacity:0;transition:opacity .2s;font-weight:850;white-space:nowrap}#toast.show{opacity:1}#rotate{position:absolute;bottom:max(80px,env(safe-area-inset-bottom) + 62px);right:18px;border-radius:50%;height:84px;width:84px;border:2px solid #83f4ff;background:#122a4bd9;color:white;font-size:12px;font-weight:900;pointer-events:auto;display:none}#rotate:active{background:#287b89}#brake{position:absolute;bottom:max(174px,env(safe-area-inset-bottom) + 155px);left:18px;border-radius:16px;padding:13px;background:#172e49dd;color:white;border:2px solid #bb9dff;font-weight:850;pointer-events:auto;display:none}#jump{position:absolute;bottom:max(80px,env(safe-area-inset-bottom) + 62px);left:18px;border-radius:50%;height:84px;width:84px;border:2px solid #ffd78d;background:#47301ed9;color:white;font-size:12px;font-weight:900;pointer-events:auto;display:none}
</style></head><body><canvas id="game"></canvas><div id="ui"><div id="hud"><div class="stat">PUNKTE<br><b id="score">0</b></div><div class="stat gem">◆ <b id="crystals">0</b><div style="font-size:10px;color:#c6d6f6">Kristalle</div></div><div class="stat">SALTO SERIE<br><b id="streak">0</b> <span id="boost" class="boost"></span></div><button id="pause" aria-label="Pause">Ⅱ</button></div><div id="tip">TIPPE: SPRINGEN · HALTEN: SALTO</div><button id="jump">SPRUNG</button><button id="rotate">SALTO ↻</button><button id="brake">BREMSEN</button><div id="toast"></div><div id="overlay"><div id="panel"><div style="font-size:14px;font-weight:900;letter-spacing:4px;color:#83f4ff;margin-bottom:10px">CRYSTAL RUSH</div><h1>SKATE <span>ESCAPE</span></h1><p>Nur dein Skateboard. Hügel, Rampen, Kristalle und spektakuläre Saltos.</p><div id="menuContent"></div></div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const $=s=>document.querySelector(s);let braking=false;let W=0,H=0,dpr=1,scale=1,last=0,mode='menu',time=0,cam=0,boardY=0,vy=0,angle=0,air=false,spin=0,streak=0,boost=false,score=0,runCrystals=0,worldX=80,prevX=80,spd=4,objects=[],nextObj=300,hold=false,pressTime=0,canJump=true,particles=[],shake=0,menuMode='home';const defaults={bank:0,best:0,owned:['classic'],selected:'classic'};let save;try{save={...defaults,...JSON.parse(localStorage.getItem('skateEscapeV2')||'{}')}}catch(e){save={...defaults}};const boards=[{id:'classic',name:'Classic',price:0,color:'#5ce6e4',glow:'#4cebe9',shape:'rounded',speed:1,flip:1,brake:1,desc:'Ausgeglichen'},{id:'sunset',name:'Arrow',price:25,color:'#ff9a65',glow:'#ff655f',shape:'pointed',speed:1.17,flip:.93,brake:.9,desc:'Spitz · schnell'},{id:'neon',name:'Spinner',price:70,color:'#a6f95e',glow:'#a0ff3d',shape:'short',speed:.95,flip:1.38,brake:1,desc:'Kurzes Board · schnelle Saltos'},{id:'violet',name:'Control',price:150,color:'#bb9dff',glow:'#b58aff',shape:'square',speed:.91,flip:1.04,brake:1.65,desc:'Eckig · starkes Bremsen'},{id:'gold',name:'Rocket',price:300,color:'#ffe18a',glow:'#ffd54f',shape:'pointed',speed:1.32,flip:1.13,brake:.8,desc:'Maximale Geschwindigkeit'},{id:'cosmic',name:'Phantom',price:600,color:'#ff7edc',glow:'#fc59ed',shape:'split',speed:1.12,flip:1.45,brake:1.12,desc:'Spezialform · Tricks'}];function persist(){try{localStorage.setItem('skateEscapeV2',JSON.stringify(save))}catch(e){}}function resize(){dpr=Math.min(devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(1.3,Math.max(.75,W/400))}addEventListener('resize',resize);resize();function ground(x){return H*.72+Math.sin(x*.0034)*46+Math.sin(x*.008)*18+Math.sin(x*.00115)*30}function slope(x){return (ground(x+8)-ground(x-8))/16}function selected(){return boards.find(b=>b.id===save.selected)||boards[0]}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),1300)}function hud(){ $('#score').textContent=score;$('#crystals').textContent=save.bank+runCrystals;$('#streak').textContent=streak;$('#boost').textContent=boost?'⚡ BOOST':''}function menu(which='home'){mode='menu';menuMode=which;hold=false;$('#overlay').classList.remove('hidden');$('#pause').style.display='none';$('#tip').style.display='none';$('#jump').style.display='none';$('#rotate').style.display='none';$('#brake').style.display='none';const c=$('#menuContent');if(which==='shop'){c.innerHTML=`<p>Deine Kristalle: <b style="color:#83f4ff">◆ ${save.bank}</b><br><small>Alle Boards lassen sich erspielen. Kein Echtgeld nötig.</small></p><div class="shop-grid">${boards.map(b=>`<div class="item"><div class="preview ${b.shape}" style="background:${b.color};box-shadow:0 0 18px ${b.glow}55"></div><strong>${b.name}</strong><small>${b.desc}<br>Tempo ${Math.round(b.speed*100)}% · Salto ${Math.round(b.flip*100)}% · Bremse ${Math.round(b.brake*100)}%</small><small>${save.owned.includes(b.id)?'Freigeschaltet':'◆ '+b.price}</small><button data-board="${b.id}" ${!save.owned.includes(b.id)&&save.bank<b.price?'disabled':''}>${save.selected===b.id?'AUSGEWÄHLT':save.owned.includes(b.id)?'AUSWÄHLEN':'KAUFEN'}</button></div>`).join('')}</div><button class="secondary" id="back">← ZURÜCK</button>`;c.querySelectorAll('[data-board]').forEach(el=>el.onclick=()=>{const b=boards.find(z=>z.id===el.dataset.board);if(!save.owned.includes(b.id)){if(save.bank<b.price)return;save.bank-=b.price;save.owned.push(b.id)}save.selected=b.id;persist();hud();menu('shop')});$('#back').onclick=()=>menu('home')}else{c.innerHTML=`<p style="margin:18px 0">Rekord: <b>${save.best}</b> Punkte · Gesammelt: <b style="color:#83f4ff">◆ ${save.bank}</b></p><button class="primary" id="play">▶ SPIELEN</button><button class="secondary" id="shop">◆ SKATEBOARD SHOP</button><p style="font-size:12px;margin-bottom:0">Tippe zum Springen. Halte den Finger in der Luft, um dich zu drehen. Fünf gelandete Saltos aktivieren den Boost.</p>`;$('#play').onclick=start;$('#shop').onclick=()=>menu('shop')}}function start(){mode='play';$('#overlay').classList.add('hidden');$('#pause').style.display='block';$('#tip').style.display='block';$('#jump').style.display='block';$('#rotate').style.display='block';$('#brake').style.display='block';worldX=80;prevX=80;cam=0;vy=0;angle=0;air=false;spin=0;streak=0;boost=false;score=0;runCrystals=0;spd=4;braking=false;nextObj=320;objects=[];particles=[];shake=0;boardY=ground(worldX)-13;canJump=true;hud()}function end(){mode='dead';hold=false;save.bank+=runCrystals;save.best=Math.max(save.best,score);persist();hud();$('#overlay').classList.remove('hidden');$('#pause').style.display='none';$('#tip').style.display='none';$('#jump').style.display='none';$('#rotate').style.display='none';$('#brake').style.display='none';$('#menuContent').innerHTML=`<h2 style="font-size:26px;margin:15px 0 4px">RUNDE VORBEI</h2><p><b>${score}</b> Punkte · <span style="color:#83f4ff">◆ ${runCrystals}</span> Kristalle gesammelt<br>Rekord: ${save.best}</p><button class="primary" id="retry">↻ NOCHMAL</button><button class="secondary" id="shop">◆ SKATEBOARD SHOP</button>`;$('#retry').onclick=start;$('#shop').onclick=()=>menu('shop')}function spawn(){while(nextObj<worldX+W+550){const x=nextObj;const r=Math.random();if(r<.58){objects.push({type:'gem',x,y:ground(x)-45-Math.random()*40,got:false});if(Math.random()<.45)objects.push({type:'gem',x:x+31,y:ground(x+31)-62,got:false})}else if(r<.88){objects.push({type:'cone',x,y:ground(x)-16})}else{objects.push({type:'ramp',x,y:ground(x)})}nextObj+=95+Math.random()*105}}function particlesAt(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,life:30+Math.random()*20,color})}function collisionCone(o){const dx=o.x-worldX;if(Math.abs(dx)>40)return false;const pts=[[-23,5],[-17,14],[17,14],[23,5],[-17,-5],[17,-5]];const ca=Math.cos(angle),sa=Math.sin(angle);for(const [px,py] of pts){const wx=worldX+px*ca-py*sa,wy=boardY+px*sa+py*ca;if(wx>o.x-12&&wx<o.x+12&&wy>o.y-23&&wy<o.y+13){const t=(wy-(o.y-23))/36,half=2+10*t;if(Math.abs(wx-o.x)<half)return true}}return false}function update(dt){if(mode!=='play')return;time+=dt;const sl=slope(worldX),target=(Math.max(2.8,Math.min(8.2,4.6+sl*26))+(boost?2.9:0))*selected().speed*(braking?Math.max(.32,1-.38*selected().brake):1);spd+=(target-spd)*Math.min(1,.024*dt);prevX=worldX;worldX+=spd*dt;cam=worldX-W*.26;const floor=ground(worldX)-13;const wasAir=air;if(air){vy+=.42*dt;boardY+=vy*dt;if(hold){const da=.105*dt*selected().flip;angle+=da;spin+=da}if(boardY>=floor&&vy>=0){boardY=floor;air=false;vy=0;const flips=Math.floor((spin+.22)/(Math.PI*2));if(flips>0){streak+=flips;particlesAt(worldX,boardY-25,'#ffe89c',18);toast('+'+flips+' SALTO ✦');if(streak>=5&&!boost){boost=true;toast('⚡ BOOST AKTIV!')}}else if(spin>.7){streak=0;boost=false}spin=0;angle=Math.atan(sl)*.65;canJump=true}}else{boardY=floor;angle=Math.atan(sl)*.65;canJump=true}spawn();for(const o of objects){if(o.type==='gem'&&!o.got&&Math.abs(o.x-worldX)<27&&Math.abs(o.y-boardY)<54){o.got=true;runCrystals++;particlesAt(o.x,o.y,'#8cf9ff',8)}if(o.type==='cone'&&collisionCone(o)){particlesAt(worldX,boardY,'#ff8b8b',24);shake=12;end();return}if(o.type==='ramp'&&!air&&prevX<=o.x&&worldX>=o.x){air=true;vy=-10.5;canJump=false;spin=0;angle=-.25;toast('RAMPENSPRUNG!')}}objects=objects.filter(o=>o.x>worldX-150&&!o.got);score=Math.max(score,Math.floor((worldX-80)/15));hud();particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.13*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}function jump(){if(mode!=='play')return;if(!air&&canJump){air=true;canJump=false;vy=-10.5;spin=0;angle=-.12;particlesAt(worldX,boardY+9,'#c6eaff',7)}}function inputDown(e){if(e.target.closest('button'))return;if(mode==='play'){e.preventDefault();pressTime=performance.now();hold=true;jump()}}function inputUp(){hold=false}canvas.addEventListener('pointerdown',inputDown);addEventListener('pointerup',inputUp);addEventListener('pointercancel',inputUp);$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#rotate').addEventListener('pointerdown',e=>{e.preventDefault();hold=true});$('#rotate').addEventListener('pointerup',()=>hold=false);$('#rotate').addEventListener('pointercancel',()=>hold=false);$('#brake').addEventListener('pointerdown',e=>{e.preventDefault();braking=true});for(const event of ['pointerup','pointercancel','pointerleave'])$('#brake').addEventListener(event,()=>braking=false);$('#pause').onclick=()=>{if(mode==='play'){mode='pause';$('#overlay').classList.remove('hidden');$('#menuContent').innerHTML='<h2>PAUSE</h2><button class="primary" id="resume">▶ WEITER</button><button class="secondary" id="quit">HAUPTMENÜ</button>';$('#resume').onclick=()=>{mode='play';$('#overlay').classList.add('hidden')};$('#quit').onclick=()=>menu('home')}};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat){hold=true;jump()}}});addEventListener('keyup',e=>{if(e.code==='Space')hold=false});function drawBoard(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);const b=selected();ctx.shadowColor=b.glow;ctx.shadowBlur=boost?25:13;ctx.fillStyle=b.color;ctx.beginPath();const sh=b.shape;if(sh==='pointed'){ctx.moveTo(-33,-2);ctx.lineTo(-21,-9);ctx.lineTo(21,-9);ctx.lineTo(33,-2);ctx.lineTo(21,3);ctx.lineTo(-21,3)}else if(sh==='square'){ctx.rect(-30,-8,60,12)}else if(sh==='short'){ctx.roundRect(-23,-9,46,13,10)}else if(sh==='split'){ctx.moveTo(-32,-3);ctx.lineTo(-22,-10);ctx.lineTo(22,-10);ctx.lineTo(32,-3);ctx.lineTo(21,4);ctx.lineTo(-21,4)}else{ctx.roundRect(-28,-7,56,10,5)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffffb0';ctx.lineWidth=1.4;ctx.stroke();ctx.fillStyle='#15243e';ctx.beginPath();ctx.roundRect(sh==='short'?-17:-23,-6,sh==='short'?34:46,3,2);ctx.fill();for(const xx of (sh==='short'?[-15,15]:[-19,19])){ctx.fillStyle='#b8d3f6';ctx.beginPath();ctx.arc(xx,8,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263955';ctx.beginPath();ctx.arc(xx,8,3,0,Math.PI*2);ctx.fill()}ctx.restore()}function diamond(x,y,s){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.shadowBlur=17;ctx.shadowColor='#67f6ff';ctx.fillStyle='#6fefff';ctx.fillRect(-s/2,-s/2,s,s);ctx.shadowBlur=0;ctx.fillStyle='#d7ffff';ctx.fillRect(-s/2,-s/2,s*.4,s*.4);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#080d20');sky.addColorStop(.6,'#172950');sky.addColorStop(1,'#315077');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();for(let layer=0;layer<3;layer++){ctx.beginPath();const offset=cam*(.08+layer*.11),base=H*(.56+layer*.08);ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=9){let y=base+Math.sin((x+offset)*(.004+layer*.002))*25+Math.sin((x+offset)*.011)*9;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=['#192d50','#213b5c','#2b4967'][layer];ctx.fill()}ctx.restore();const offset=mode==='menu'?time*1.5:cam;ctx.beginPath();ctx.moveTo(0,H);for(let sx=0;sx<=W+8;sx+=4){ctx.lineTo(sx,ground(sx+offset))}ctx.lineTo(W,H);ctx.closePath();const dirt=ctx.createLinearGradient(0,H*.55,0,H);dirt.addColorStop(0,'#294f68');dirt.addColorStop(1,'#101c35');ctx.fillStyle=dirt;ctx.fill();ctx.beginPath();for(let sx=0;sx<=W+8;sx+=4){if(sx===0)ctx.moveTo(sx,ground(sx+offset));else ctx.lineTo(sx,ground(sx+offset))}ctx.strokeStyle='#65d5d6';ctx.lineWidth=3;ctx.shadowBlur=10;ctx.shadowColor='#5ae5dd';ctx.stroke();ctx.shadowBlur=0;for(const o of objects){const x=o.x-cam;if(x<-50||x>W+50)continue;if(o.type==='gem'&&!o.got)diamond(x,o.y+Math.sin(time*.07+o.x)*4,16);else if(o.type==='cone'){ctx.fillStyle='#ff786c';ctx.beginPath();ctx.moveTo(x,o.y-24);ctx.lineTo(x-12,o.y+14);ctx.lineTo(x+12,o.y+14);ctx.closePath();ctx.fill();ctx.fillStyle='#ffdfb3';ctx.fillRect(x-8,o.y+2,16,5)}else if(o.type==='ramp'){ctx.fillStyle='#e9a85d';ctx.beginPath();ctx.moveTo(x-25,o.y+4);ctx.lineTo(x+23,o.y-24);ctx.lineTo(x+23,o.y+4);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffe5a1';ctx.lineWidth=3;ctx.stroke()}}if(mode==='play'||mode==='pause'||mode==='dead'){const px=worldX-cam;ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.8}if(boost){ctx.strokeStyle='#ffe18c99';ctx.lineWidth=2;for(let i=0;i<7;i++){const y=boardY-30+i*8;ctx.beginPath();ctx.moveTo(px-40-Math.random()*80,y);ctx.lineTo(px-15,y);ctx.stroke()}}drawBoard(px,boardY,angle);ctx.restore()}else{drawBoard(W*.25,ground(W*.25+offset)-13,Math.atan(slope(W*.25+offset))*.65)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/50);ctx.fillStyle=p.color;ctx.fillRect(p.x-cam-2,p.y-2,4,4)}ctx.globalAlpha=1}function frame(t){const dt=Math.min((t-last)/16.667||1,2);last=t;if(mode==='play')update(dt);else if(mode==='menu')time+=dt;draw();requestAnimationFrame(frame)}hud();menu('home');requestAnimationFrame(frame)})();
</script></body></html>
