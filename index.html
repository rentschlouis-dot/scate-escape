<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1224"><title>Skate Escape</title><style>*{box-sizing:border-box}body{margin:0;background:#080d1a;color:white;font-family:system-ui,Arial;display:grid;place-items:center;min-height:100dvh}.wrap{width:min(100vw,500px);padding:10px}h2{margin:5px 0 9px;font-size:20px}canvas{width:100%;height:auto;display:block;border-radius:15px;background:#101c34;touch-action:none}button{width:100%;padding:16px;background:#38e6cc;border:0;border-radius:12px;font-weight:800;font-size:17px;margin-top:9px;touch-action:none}.note{color:#aebbd1;font-size:13px;margin:10px 3px;text-align:center}</style></head><body><div class="wrap"><h2>🛹 SKATE ESCAPE</h2><canvas id="game" width="420" height="650"></canvas><button id="control">START / SPRINGEN / HALTEN FÜR SALTO</button><div class="note">Tippen = springen · Gedrückt halten = drehen · 5 saubere Saltos = BOOST</div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),btn=document.getElementById('control');let mode='ready',distance=0,speed=3.2,air=false,y=0,vy=0,angle=0,rot=0,holding=false,streak=0,boost=false,score=0,record=0,objects=[],last=0,spawn=0;try{record=Number(localStorage.getItem('skateRecord')||0)}catch(e){}const W=420,H=650,bikeX=108;function terrain(z){return 445+55*Math.sin(z/170)+27*Math.sin(z/79)}function slope(z){return (terrain(z+3)-terrain(z-3))/6}function reset(){mode='play';distance=0;speed=3.2;air=false;y=terrain(bikeX);vy=0;angle=0;rot=0;streak=0;boost=false;score=0;objects=[];spawn=0}function press(){if(mode!=='play')reset();holding=true;if(!air){air=true;vy=-10.8;rot=0;angle=Math.atan2(slope(distance+bikeX),1)}}function release(){holding=false}btn.addEventListener('pointerdown',e=>{e.preventDefault();press()});btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);c.addEventListener('pointerdown',e=>{e.preventDefault();press()});c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat)press()});window.addEventListener('keyup',e=>{if(e.code==='Space')release()});function crash(){mode='over';holding=false;boost=false;record=Math.max(record,score);try{localStorage.setItem('skateRecord',record)}catch(e){}}function update(dt){if(mode!=='play')return;let hill=slope(distance+bikeX);let target=Math.max(2.25,Math.min(5.9,3.7+hill*3.1+(boost?2.3:0)));speed+=(target-speed)*.035*dt;distance+=speed*dt;score=Math.floor(distance/10);if(air){vy+=.36*dt;y+=vy*dt;if(holding)angle+=.095*dt;let ground=terrain(distance+bikeX);if(y>=ground){let normalized=((angle-Math.atan2(slope(distance+bikeX),1)+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;let completed=Math.round(rot/(Math.PI*2));if(Math.abs(normalized)>.75||Math.abs(vy)>16){crash();return}if(completed>0){streak+=completed;if(streak>=5)boost=true}else{streak=0;boost=false}air=false;y=ground;angle=Math.atan2(slope(distance+bikeX),1);vy=0;rot=0}}else{y=terrain(distance+bikeX);angle=Math.atan2(slope(distance+bikeX),1)}if(air&&holding)rot+=.095*dt;spawn+=speed*dt;if(spawn>270){spawn=0;let pos=distance+W+100;objects.push({z:pos,type:Math.random()>.5?'crate':'cone'})}objects=objects.filter(o=>o.z>distance-50);for(let o of objects){let sx=o.z-distance;if(Math.abs(sx-bikeX)<22&&y>terrain(o.z)-37){crash();return}}}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c1531');g.addColorStop(1,'#263960');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<24;i++){let px=(i*89-distance*.15)%W;if(px<0)px+=W;x.fillStyle='#ffffff33';x.fillRect(px,40+(i*67)%250,2,2)}x.beginPath();x.moveTo(0,H);for(let px=0;px<=W;px+=3)x.lineTo(px,terrain(distance+px)+8);x.lineTo(W,H);x.closePath();x.fillStyle='#102c39';x.fill();x.beginPath();for(let px=0;px<=W;px+=3){let py=terrain(distance+px);if(px===0)x.moveTo(px,py);else x.lineTo(px,py)}x.strokeStyle='#43e6d0';x.lineWidth=5;x.stroke();for(let o of objects){let sx=o.z-distance,sy=terrain(o.z);if(sx< -30||sx>W+30)continue;x.fillStyle=o.type==='crate'?'#ffbc59':'#fa637f';if(o.type==='crate')x.fillRect(sx-14,sy-27,28,27);else{x.beginPath();x.moveTo(sx,sy-34);x.lineTo(sx+15,sy);x.lineTo(sx-15,sy);x.fill()}}x.save();x.translate(bikeX,y-15);x.rotate(angle);if(boost){x.shadowColor='#ffe56a';x.shadowBlur=22}x.lineCap='round';x.fillStyle=boost?'#ffe56a':'#46e6d0';x.strokeStyle='#e8f6ff';x.lineWidth=3; x.beginPath();x.roundRect(-30,-2,60,8,4);x.fill();x.stroke();x.shadowBlur=0;for(const wx of [-19,19]){x.fillStyle='#ff8aa3';x.beginPath();x.arc(wx,10,5,0,Math.PI*2);x.fill();x.fillStyle='#17253b';x.beginPath();x.arc(wx,10,2,0,Math.PI*2);x.fill()}x.strokeStyle='#f4f6ff';x.lineWidth=5;x.beginPath();x.moveTo(-8,-4);x.lineTo(-5,-19);x.lineTo(6,-28);x.lineTo(13,-15);x.stroke();x.beginPath();x.moveTo(6,-28);x.lineTo(-6,-36);x.lineTo(-18,-31);x.stroke();x.fillStyle='#ffe0b7';x.beginPath();x.arc(7,-42,7,0,Math.PI*2);x.fill();x.fillStyle='#ff6383';x.beginPath();x.arc(7,-44,8,Math.PI,2*Math.PI);x.fill();x.restore();x.fillStyle='white';x.font='bold 19px system-ui';x.fillText('Punkte '+score,17,32);x.font='14px system-ui';x.fillText('Rekord '+record,17,53);x.fillText('Saltos '+streak+'/5',17,74);x.fillText('Tempo '+Math.round(speed*20),310,32);if(boost){x.fillStyle='#ffe56a';x.font='bold 22px system-ui';x.fillText('⚡ BOOST',294,66)}if(mode!=='play'){x.fillStyle='#08101bdc';x.fillRect(25,210,370,180);x.fillStyle='white';x.textAlign='center';x.font='bold 28px system-ui';x.fillText(mode==='ready'?'SKATE ESCAPE':'GAME OVER',210,260);x.font='17px system-ui';x.fillText(mode==='ready'?'Tippe zum Starten':'Punkte: '+score,210,297);x.fillText('Tippe zum Spielen',210,330);x.textAlign='left'}}function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
